services:
  - type: web
    name: ipo-gmp-watch
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CONVEX_URL
        sync: false
      - key: CONVEX_ADMIN_KEY
        sync: false
